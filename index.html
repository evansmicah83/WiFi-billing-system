  <head>
    <meta charset="UTF-8" />

    <meta name="description" content="Multi-tenant ISP billing, Hotspot, PPPoE, MikroTik automation, CGNAT remote management, and public IP platform for Kenyan internet service providers." />
    <meta property="og:title" content="SmartLinkNet Kenya - ISP Billing & MikroTik Automation" />
    <meta property="og:description" content="Multi-tenant ISP billing, Hotspot, PPPoE, MikroTik automation, CGNAT remote management, and public IP platform for Kenyan internet service providers." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // AI Studio environment constraint: HMR is disabled, ignore dev WebSocket errors
      window.addEventListener('error', function(e) {
        if (
          e.message && (
            e.message.indexOf('WebSocket') !== -1 ||
            e.message.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
            e.message.indexOf('failed to connect') !== -1 ||
            (e.filename && e.filename.indexOf('@vite/client') !== -1)
          )
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var reason = e.reason && (e.reason.message || String(e.reason));
        if (reason && (reason.indexOf('WebSocket') !== -1 || reason.indexOf('createWebSocketModuleRunnerTransport') !== -1)) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
  </head>
  <body class="bg-[#F5F8FC] text-[#172B4D] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
